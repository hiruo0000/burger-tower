<style>
  :root{
    --sky1:#9FE8FF; --sky2:#45BDEC;
    --cream:#FFF8EC;
    --sun:#FFD23F;
    --tomato:#FF5C5C;
    --leaf:#5FD35A;
    --ink:#3B2A20;
    --display:"Baloo 2","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
    --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--body);font-weight:800;color:var(--ink);
    background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,#2FA9DC);
    display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden;
  }
  #app{width:min(100%,420px);height:100dvh;max-height:940px;
    display:flex;flex-direction:column;gap:8px;user-select:none}

  .hud{display:flex;gap:8px;flex:0 0 auto}
  .stat{
    flex:1;min-width:0;min-height:56px;background:var(--cream);border:3px solid var(--ink);border-radius:16px;
    padding:6px 10px;box-shadow:0 4px 0 rgba(59,42,32,.35);
    display:flex;flex-direction:column;justify-content:center;
  }
  .stat .k{font-size:12px;font-weight:800;line-height:1.2;opacity:.7}
  .stat .v{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;white-space:nowrap}
  .stat .v small{font-size:11px;margin-left:2px;opacity:.6}
  .stat.best .v{color:#E08A1E}
  .stat.time .v{color:#2FA9DC}
  .stat.time.low .v{color:var(--tomato)}

  .timebar{flex:0 0 auto;height:12px;border:3px solid var(--ink);border-radius:99px;background:var(--cream);overflow:hidden;box-shadow:0 3px 0 rgba(59,42,32,.3)}
  .timebar i{display:block;height:100%;width:100%;background:var(--leaf);transition:width .12s linear}
  .timebar.low i{background:var(--tomato)}

  .balance{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .balance .lab{font-size:12px;font-weight:800;white-space:nowrap;color:var(--cream);text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .tray{position:relative;flex:1;height:20px;border:3px solid var(--ink);border-radius:99px;background:var(--cream);box-shadow:0 3px 0 rgba(59,42,32,.3)}
  .tray .zone{position:absolute;inset:2px 12%;border-radius:99px;background:rgba(95,211,90,.35)}
  .slice{
    position:absolute;top:0;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;
    background:var(--tomato);border:2.5px solid var(--ink);transition:left .05s linear,background .2s;
  }
  .slice.hot{background:#FF2D2D;animation:buzz .18s infinite}
  @keyframes buzz{50%{transform:translateY(-2px)}}

  .stage{position:relative;flex:1 1 auto;min-height:0;
    border:4px solid var(--ink);border-radius:22px;overflow:hidden;
    box-shadow:0 8px 0 rgba(59,42,32,.35);background:#BFEEFF}
  canvas{display:block;width:100%;height:100%;object-fit:contain;touch-action:manipulation;cursor:pointer}

  .veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;text-align:center;padding:22px;background:rgba(255,248,236,.94)}
  .veil[hidden]{display:none}
  .veil h1{font-family:var(--display);font-weight:900;font-size:38px;line-height:1.08;color:#E24A2B;
    letter-spacing:.02em;text-shadow:3px 3px 0 var(--sun),-2px -2px 0 var(--cream),4px 4px 0 rgba(59,42,32,.18)}
  .veil h1 em{display:block;font-style:normal;font-weight:800;font-size:13px;letter-spacing:.24em;color:var(--ink);opacity:.55;margin-bottom:6px;text-shadow:none}
  .veil p{font-size:15px;font-weight:800;line-height:2;max-width:20em;letter-spacing:.02em}
  .veil p b{color:#E24A2B}
  .veil p.hint{font-size:13px;font-weight:800;color:#2E9B4F;margin-top:-6px}
  .veil p.cheer{
    font-size:17px;font-weight:900;color:#E24A2B;margin-top:-4px;
    text-shadow:2px 2px 0 var(--sun),-1px -1px 0 var(--cream);
  }
  .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:330px}
  .btn{
    width:100%;min-height:64px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1;color:var(--ink);
    background:var(--sun);border:3px solid var(--ink);border-radius:18px;padding:8px 10px;cursor:pointer;
    box-shadow:0 5px 0 var(--ink);transition:transform .07s,box-shadow .07s;
  }
  .btn.green{background:var(--leaf)}
  .btn.red{background:var(--tomato);color:var(--cream)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .btn:focus-visible{outline:3px solid #2FA9DC;outline-offset:3px}
  .btn[aria-pressed="false"]{opacity:.45;filter:saturate(.45);box-shadow:0 3px 0 rgba(59,42,32,.5)}
  .btn.start{
    width:100%;max-width:330px;min-height:70px;font-size:26px;
    background:var(--tomato);color:var(--cream);text-shadow:2px 2px 0 rgba(59,42,32,.35);
  }
  .btn.start small{opacity:.9}
  .btn small{display:block;font-family:var(--body);font-size:11px;font-weight:800;opacity:.72;margin-top:3px;line-height:1.2}

  .final{display:flex;align-items:baseline;gap:6px;font-family:var(--display)}
  .final .n{font-size:80px;font-weight:800;color:#E24A2B;line-height:.9;text-shadow:3px 3px 0 var(--sun)}
  .final .u{font-size:20px;font-weight:800}
  .rank{font-size:16px;font-weight:900;color:#2E9B4F}
  .reason{font-family:var(--display);font-size:22px;font-weight:900;color:var(--ink);
    background:var(--sun);border:3px solid var(--ink);border-radius:99px;padding:4px 20px;
    box-shadow:0 4px 0 var(--ink)}

  .foot{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--cream);
    text-shadow:0 2px 0 rgba(0,0,0,.22);padding:0 4px}
  .foot kbd{font-family:var(--display);background:rgba(255,255,255,.3);border-radius:5px;padding:1px 6px}
  .toggles{display:flex;gap:6px}
  .mute{
    background:rgba(255,255,255,.28);border:2px solid rgba(59,42,32,.5);color:var(--ink);
    font:inherit;font-size:11px;cursor:pointer;padding:3px 9px;border-radius:99px;
    min-width:88px;text-align:center;text-shadow:none;
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition-duration:.01ms !important}}
</style>

  <div class="hud">
    <div class="stat"><div class="k">つみあげ</div><div class="v" id="cur">0<small>こ</small></div></div>

    <div class="stat time" id="timeBox"><div class="k">のこり</div><div class="v" id="time">60<small>びょう</small></div></div>

  <div class="balance">
    <div class="lab">バランス</div>

  </div>

  <div class="stage">
    <canvas id="cv" width="400" height="640"></canvas>

    <div class="veil" id="startVeil">
      <h1><em>BURGER TOWER</em>バーガータワー</h1>
      <p>タップして具材を落とそう！<br>ずれるとハンバーガーがグラグラ、<br>はずすといっきにくずれるよ</p>
      <p class="cheer">おおきなハンバーガーを作ってね！</p>
      <p class="hint">かんたんは みどりの ▼ が ガイドだよ</p>
      <div class="btnrow">
        <button class="btn green" data-diff="easy" aria-pressed="true">かんたん<small>ゆっくり・ガイドつき</small></button>
        <button class="btn" data-diff="normal" aria-pressed="false">むずかしい<small>はやい・ガイドなし</small></button>

    </div>

      <button class="mute" id="sfxBtn">🔔 おと ON</button>
    </span>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=400,H=640;
function fit(){const r=Math.min(window.devicePixelRatio||1,2);cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0);}
fit();addEventListener('resize',fit);

const LW=118, LH=27, CX=200;
const BASE_Y=580, BUN_H=34, STACK_Y=BASE_Y-BUN_H;
const GAME_TIME=60;
const DROP_GAP=155;      // how far above the tower the next piece floats
const CAM_TOP=300;       // screen y the tower top settles at

const DIFFS={
  easy  :{sp0:1.4,sp1:1.0,plate:52,step:54,perfect:14,decay:.87,tiltK:.060,wobK:.00020,wobDamp:.970,guide:true ,label:'かんたん'},
  normal:{sp0:1.9,sp1:2.2,plate:44,step:46,perfect:10,decay:.80,tiltK:.085,wobK:.00038,wobDamp:.976,guide:false,label:'むずかしい'}
};
let D=DIFFS.easy;

let stack=[],mover=null,falling=null,debris=[],pops=[],bits=[],clouds=[];
let state='ready',cam=0,best=0,timeLeft=GAME_TIME,lastT=0,combo=0;
let shake=0,tiltAnim=0,collapseT=0,collapseDir=1,flashT=0;
let wob=0,wobV=0,overT=0,topple=null;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=i=>{const s=Math.sin(i*127.1+31.7)*43758.5453;return s-Math.floor(s);};

/* ---------- audio: soft SFX + pop BGM ---------- */
let AC=null,master=null,musicBus=null,sfxBus=null,noiseBuf=null;
let sfxOn=true,bgmOn=true,musicTimer=null,mStep=0,mNext=0;
const nf=m=>440*Math.pow(2,(m-69)/12);

function audio(){
  if(AC)return AC;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.85;
    const comp=AC.createDynamicsCompressor();
    comp.threshold.value=-14;comp.ratio.value=4;
    master.connect(comp);comp.connect(AC.destination);
    musicBus=AC.createGain();musicBus.gain.value=bgmOn?.42:0;musicBus.connect(master);
    sfxBus=AC.createGain();sfxBus.gain.value=sfxOn?1:0;sfxBus.connect(master);
    const n=AC.sampleRate*.5;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }catch(e){}
  return AC;
}
// one soft voice: gentle attack + exponential tail, low-passed so nothing bites
function voice(bus,o_){
  if(!AC||!bus)return;
  const {freq,dur=.3,type='sine',vol=.15,attack=.014,slide=0,lp=0,when=0}=o_;
  const t=when||AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur*.85);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+attack);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  if(lp){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;f.Q.value=.6;
    o.connect(f);f.connect(g);}else o.connect(g);
  g.connect(bus);o.start(t);o.stop(t+dur+.03);
}
function noise(bus,o_){
  if(!AC||!bus||!noiseBuf)return;
  const {dur=.06,vol=.05,hp=0,lp=0,when=0}=o_;
  const t=when||AC.currentTime;
  const src=AC.createBufferSource();src.buffer=noiseBuf;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let node=src;
  if(hp){const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;node.connect(f);node=f;}
  if(lp){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;node.connect(f);node=f;}
  node.connect(g);g.connect(bus);src.start(t);src.stop(t+dur+.02);
}

/* --- effects: all sine / triangle based, soft attack --- */
function sfxDrop(){if(!sfxOn)return;audio();
  voice(sfxBus,{freq:520,dur:.18,type:'sine',vol:.09,attack:.02,slide:-230,lp:1800});}
function sfxLand(){if(!sfxOn)return;audio();          // soft wooden "pon"
  voice(sfxBus,{freq:320,dur:.24,type:'sine',vol:.16,attack:.016,slide:-110,lp:1300});
  voice(sfxBus,{freq:160,dur:.3,type:'triangle',vol:.09,attack:.024,slide:-45,lp:600});
  noise(sfxBus,{dur:.05,vol:.02,hp:400,lp:2000});}
function sfxPerfect(n){if(!sfxOn)return;audio();      // gentle bell arpeggio
  const base=72+Math.min(n-1,5);
  [0,4,7].forEach((iv,i)=>voice(sfxBus,{freq:nf(base+iv),dur:.55,type:'sine',vol:.10,
    attack:.02,lp:4500,when:AC.currentTime+i*.05}));}
function sfxMiss(){if(!sfxOn)return;audio();
  voice(sfxBus,{freq:240,dur:.34,type:'sine',vol:.13,attack:.02,slide:-120,lp:900});}
function sfxCollapse(){if(!sfxOn)return;audio();      // soft low tumble, no buzz
  voice(sfxBus,{freq:180,dur:.7,type:'triangle',vol:.16,attack:.02,slide:-130,lp:520});
  voice(sfxBus,{freq:90,dur:.85,type:'sine',vol:.13,attack:.03,slide:-45,lp:300});
  noise(sfxBus,{dur:.5,vol:.05,hp:120,lp:900});}
function sfxThud(){if(!sfxOn)return;audio();      // the tower hits the table
  voice(sfxBus,{freq:120,dur:.5,type:'sine',vol:.17,attack:.02,slide:-55,lp:380});
  noise(sfxBus,{dur:.32,vol:.05,hp:80,lp:620});}
function sfxEnd(){if(!sfxOn)return;audio();
  [69,72,76,81].forEach((m,i)=>voice(sfxBus,{freq:nf(m),dur:.6,type:'sine',vol:.11,
    attack:.02,lp:5000,when:AC.currentTime+i*.11}));}
function sfxStart(){if(!sfxOn)return;audio();       // ready...go! flourish
  const t=AC.currentTime;
  [60,64,67].forEach((m,i)=>voice(sfxBus,{freq:nf(m),dur:.24,type:'triangle',vol:.12,
    attack:.012,lp:3000,when:t+i*.11}));
  [72,76,79].forEach(m=>voice(sfxBus,{freq:nf(m),dur:.65,type:'sine',vol:.09,
    attack:.016,lp:5000,when:t+.35}));}

function sfxTap(){if(!sfxOn)return;audio();          // soft button "poko"
  voice(sfxBus,{freq:680,dur:.13,type:'sine',vol:.10,attack:.008,slide:-160,lp:2400});
  noise(sfxBus,{dur:.03,vol:.018,hp:1500,lp:5000});}
function blast(t,dur){                               // one pea-whistle blast
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),
        lfo=AC.createOscillator(),lg=AC.createGain(),f=AC.createBiquadFilter();
  o.type='triangle';o.frequency.setValueAtTime(2150,t);
  lfo.type='sine';lfo.frequency.value=34;lg.gain.value=60;   // the rolling pea
  lfo.connect(lg);lg.connect(o.frequency);
  f.type='lowpass';f.frequency.value=3800;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.15,t+.025);
  g.gain.setValueAtTime(.15,t+Math.max(.03,dur-.06));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(f);f.connect(g);g.connect(sfxBus);
  o.start(t);o.stop(t+dur+.03);lfo.start(t);lfo.stop(t+dur+.03);
  noise(sfxBus,{dur:dur*.9,vol:.025,hp:2200,lp:6500,when:t});
}
function sfxWhistle(){if(!sfxOn)return;audio();      // "ピピー" = short, then long
  const t=AC.currentTime;blast(t,.14);blast(t+.21,.45);}

/* --- BGM: bouncy I-V-vi-IV pop loop --- */
const PROG=[{b:48,c:[60,64,67]},{b:43,c:[59,62,67]},{b:45,c:[60,64,69]},{b:41,c:[60,65,69]}];
const MEL=[[2,-1,0,-1,1,-1,2,4,-1,1,-1,3,-1,2,-1,-1],
           [4,-1,3,-1,2,-1,1,2,-1,0,-1,1,-1,2,3,-1]];
function kick(t){voice(musicBus,{freq:130,dur:.2,type:'sine',vol:.5,attack:.004,slide:-85,when:t});}
function clap(t){noise(musicBus,{dur:.11,vol:.13,hp:1100,lp:5200,when:t});}
function hat(t){noise(musicBus,{dur:.035,vol:.05,hp:6500,when:t});}
function playStep(i,t){
  const bar=(i>>4)&3, s=i&15, ch=PROG[bar];
  if(s%4===0||s===6||s===14)
    voice(musicBus,{freq:nf(ch.b+(s===14?12:0)),dur:.22,type:'triangle',vol:.3,attack:.008,lp:520,when:t});
  if(s===2||s===10)ch.c.forEach(n=>voice(musicBus,{freq:nf(n),dur:.2,type:'sine',vol:.075,attack:.012,lp:2400,when:t}));
  const m=MEL[bar&1][s];
  if(m>=0){
    const n=ch.c[m%3]+(m>=3?12:0);
    voice(musicBus,{freq:nf(n),dur:.28,type:'sine',vol:.15,attack:.006,lp:3600,when:t});
    voice(musicBus,{freq:nf(n+12),dur:.13,type:'sine',vol:.045,attack:.005,when:t});
  }
  if(s===0||s===8)kick(t);
  if(s===4||s===12)clap(t);
  if(s%2===1)hat(t);
}
function stepDur(){
  const bpm=(state==='play'&&timeLeft<=10)?142:126;   // final spurt speeds up
  return 60/bpm/4;
}
function musicSched(){
  if(!AC)return;
  while(mNext<AC.currentTime+.14){playStep(mStep,mNext);mStep=(mStep+1)%64;mNext+=stepDur();}
}
function musicStart(){
  audio();if(!AC)return;
  if(AC.state==='suspended')AC.resume();
  if(musicTimer)return;
  mStep=0;mNext=AC.currentTime+.12;
  musicTimer=setInterval(musicSched,25);
}
function musicStop(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}

$('bgmBtn').onclick=e=>{e.stopPropagation();bgmOn=!bgmOn;
  if(musicBus)musicBus.gain.setTargetAtTime(bgmOn?.42:0,AC.currentTime,.05);
  $('bgmBtn').textContent=bgmOn?'♪ BGM ON':'♪ BGM OFF';};
$('sfxBtn').onclick=e=>{e.stopPropagation();sfxOn=!sfxOn;
  if(sfxBus)sfxBus.gain.setTargetAtTime(sfxOn?1:0,AC.currentTime,.03);
  $('sfxBtn').textContent=sfxOn?'🔔 おと ON':'🔔 おと OFF';};

/* ---------- drawing helpers ---------- */
const OL='rgba(72,44,25,.75)';
function box(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function vgrad(y,h,stops){const g=ctx.createLinearGradient(0,y,0,y+h);for(const s of stops)g.addColorStop(s[0],s[1]);return g;}
function ink(w){ctx.lineWidth=w||2;ctx.strokeStyle=OL;ctx.lineJoin='round';ctx.stroke();}
function dot(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=c;ctx.fill();}
function blob(cx,cy,rx,ry,n,amp,seed){ // organic closed shape
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const a=i/n*Math.PI*2, k=1+Math.sin(a*3+seed)*amp+Math.cos(a*5+seed*1.7)*amp*.6;
    const px=cx+Math.cos(a)*rx*k, py=cy+Math.sin(a)*ry*k;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
}

/* ---------- ingredients ---------- */
const ING={
  patty:{draw(x,y,s){
    const w=LW,l=x-w/2;
    ctx.beginPath();
    ctx.moveTo(l+3,y+11);
    ctx.bezierCurveTo(l+w*.2,y+2,l+w*.55,y+7,l+w-3,y+9);
    ctx.bezierCurveTo(l+w+2,y+18,l+w-6,y+LH-1,l+w-14,y+LH-2);
    ctx.lineTo(l+13,y+LH-2);
    ctx.bezierCurveTo(l+4,y+LH-3,l-2,y+17,l+3,y+11);
    ctx.closePath();
    ctx.fillStyle=vgrad(y+4,LH,[[0,'#8A5730'],[.35,'#6E3F20'],[1,'#4B2712']]);ctx.fill();ink(2);
    ctx.save();ctx.clip();
    ctx.fillStyle='rgba(196,138,84,.5)';
    ctx.beginPath();ctx.ellipse(x-6,y+11,44,4,0,0,7);ctx.fill();
    for(let i=0;i<7;i++){
      const r1=rnd(s+i*2.3),r2=rnd(s+i*5.1);
      ctx.fillStyle='rgba(38,20,10,'+(.2+r1*.3)+')';
      ctx.beginPath();ctx.ellipse(l+10+r1*(w-20),y+13+r2*11,4+r1*6,1.8+r2*1.6,r1,0,7);ctx.fill();
    }
    ctx.fillStyle='rgba(255,214,168,.28)';
    for(let i=0;i<5;i++){const r1=rnd(s+i*7.7);ctx.fillRect(l+12+r1*(w-24),y+9+rnd(s+i)*3,7,1.6);}
    ctx.restore();
  }},
  cheese:{draw(x,y){
    const w=LW-6,l=x-w/2;
    ctx.beginPath();
    ctx.moveTo(l,y+7);ctx.lineTo(l+w,y+7);ctx.lineTo(l+w,y+14);
    ctx.quadraticCurveTo(l+w-6,y+26,l+w-16,y+15);
    ctx.quadraticCurveTo(l+w*.55,y+13,l+w*.46,y+24);
    ctx.quadraticCurveTo(l+w*.36,y+27,l+w*.3,y+14);
    ctx.quadraticCurveTo(l+16,y+12,l+11,y+22);
    ctx.quadraticCurveTo(l+4,y+24,l,y+14);
    ctx.closePath();
    ctx.fillStyle=vgrad(y+6,22,[[0,'#FFDE72'],[.45,'#FFC22F'],[1,'#EFA018']]);ctx.fill();ink(2);
    ctx.save();ctx.clip();
    ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillRect(l,y+7,w,2.4);
    ctx.fillStyle='rgba(255,246,190,.5)';
    ctx.beginPath();ctx.ellipse(x-22,y+11,16,2.6,0,0,7);ctx.fill();
    ctx.restore();
  }},
  lettuce:{draw(x,y,s){
    for(let k=0;k<2;k++){
      const off=k?6:0;
      ctx.beginPath();
      const n=9,w=LW+10,l=x-w/2,sw=w/n;
      ctx.moveTo(l,y+13+off);
      for(let i=0;i<n;i++)ctx.bezierCurveTo(l+sw*i+sw*.3,y+(i%2?-1:5)+off,l+sw*i+sw*.7,y+(i%2?6:-2)+off,l+sw*(i+1),y+12+off);
      ctx.lineTo(l+w,y+LH-4);
      for(let i=n;i>0;i--)ctx.quadraticCurveTo(l+sw*(i-1)+sw/2,y+LH+(i%2?3:-2),l+sw*(i-1),y+LH-5);
      ctx.closePath();
      ctx.fillStyle=k?vgrad(y,LH,[[0,'#8FE07B'],[1,'#4FAF43']]):vgrad(y,LH,[[0,'#B6EFA1'],[1,'#63C255']]);
      ctx.fill();ink(k?1.6:2);
    }
    ctx.save();ctx.globalAlpha=.5;ctx.strokeStyle='#E4FBD4';ctx.lineWidth=1.6;
    for(let i=0;i<4;i++){ctx.beginPath();
      ctx.moveTo(x-44+i*29,y+22);ctx.quadraticCurveTo(x-40+i*29,y+15,x-34+i*29,y+11);ctx.stroke();}
    ctx.restore();
  }},
  tomato:{draw(x,y){
    for(const dx of [-35,0,35]){
      const cx=x+dx, cy=y+LH/2+1;
      ctx.beginPath();ctx.ellipse(cx,cy,16,12,0,0,7);
      ctx.fillStyle=vgrad(cy-12,24,[[0,'#FF7A6E'],[.5,'#F2493F'],[1,'#C7241F']]);ctx.fill();ink(2);
      ctx.beginPath();ctx.ellipse(cx,cy,10.5,7.5,0,0,7);ctx.fillStyle='#FFB4A4';ctx.fill();
      ctx.strokeStyle='rgba(214,60,45,.65)';ctx.lineWidth=1.4;
      for(let i=0;i<4;i++){const a=i/4*Math.PI*2+.6;
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*10,cy+Math.sin(a)*7);ctx.stroke();}
      dot(cx-4,cy-2,1.5,'#FFE9C8');dot(cx+5,cy+2,1.5,'#FFE9C8');dot(cx+1,cy-4,1.3,'#FFE9C8');
      ctx.save();ctx.globalAlpha=.45;ctx.fillStyle='#fff';
      ctx.beginPath();ctx.ellipse(cx-5,cy-7,6,2,-.3,0,7);ctx.fill();ctx.restore();
    }
  }},
  onion:{draw(x,y){
    for(const dx of [-34,0,34]){
      const cx=x+dx,cy=y+LH/2+1;
      ctx.beginPath();ctx.ellipse(cx,cy,16,11,0,0,7);
      ctx.fillStyle='rgba(238,224,247,.92)';ctx.fill();
      ctx.strokeStyle='rgba(150,105,180,.9)';ctx.lineWidth=2;ctx.stroke();
      ctx.beginPath();ctx.ellipse(cx,cy,11,7.2,0,0,7);ctx.strokeStyle='rgba(168,126,196,.8)';ctx.lineWidth=1.8;ctx.stroke();
      ctx.beginPath();ctx.ellipse(cx,cy,6,3.6,0,0,7);ctx.strokeStyle='rgba(186,150,208,.7)';ctx.lineWidth=1.5;ctx.stroke();
      ctx.save();ctx.globalAlpha=.6;ctx.fillStyle='#fff';
      ctx.beginPath();ctx.ellipse(cx-5,cy-6,6,1.8,-.25,0,7);ctx.fill();ctx.restore();
    }
  }},
  bacon:{draw(x,y,s){
    const w=LW,l=x-w/2;
    ctx.beginPath();
    ctx.moveTo(l,y+9);
    ctx.bezierCurveTo(l+w*.28,y+1,l+w*.55,y+16,l+w,y+6);
    ctx.lineTo(l+w,y+20);
    ctx.bezierCurveTo(l+w*.55,y+29,l+w*.28,y+14,l,y+22);
    ctx.closePath();
    ctx.fillStyle=vgrad(y+2,26,[[0,'#D9543E'],[.5,'#B93A2A'],[1,'#8E2618']]);ctx.fill();ink(2);
    ctx.save();ctx.clip();
    ctx.fillStyle='rgba(255,214,196,.85)';
    ctx.beginPath();ctx.moveTo(l,y+11);ctx.bezierCurveTo(l+w*.28,y+3,l+w*.55,y+18,l+w,y+8);
    ctx.lineTo(l+w,y+12);ctx.bezierCurveTo(l+w*.55,y+22,l+w*.28,y+7,l,y+15);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,196,172,.6)';
    ctx.beginPath();ctx.moveTo(l,y+18);ctx.bezierCurveTo(l+w*.3,y+10,l+w*.6,y+24,l+w,y+15);
    ctx.lineTo(l+w,y+18);ctx.bezierCurveTo(l+w*.6,y+27,l+w*.3,y+13,l,y+21);ctx.closePath();ctx.fill();
    ctx.restore();
  }},
  egg:{draw(x,y){
    ctx.save();
    blob(x-8,y+15,34,11,26,.07,2.1);
    ctx.fillStyle=vgrad(y+3,24,[[0,'#FFFFFF'],[1,'#F2E4CC']]);ctx.fill();ink(2);
    ctx.restore();
    ctx.beginPath();ctx.ellipse(x+8,y+14,10,8.5,0,0,7);
    const g=ctx.createRadialGradient(x+5,y+11,1,x+8,y+14,11);
    g.addColorStop(0,'#FFE07A');g.addColorStop(.6,'#FFC01F');g.addColorStop(1,'#E89A0C');

/* ---------- physics / state ---------- */
/* The tower is judged as one body standing on the plate.
   Weights decay downward (D.decay per layer), so the pieces near the top count most:
   a bad drop is felt straight away, and putting the next piece on the OTHER side
   pulls the centre of mass back toward the middle - exactly like real stacking. */
function lean(){
  const n=stack.length;if(!n)return 0;
  let s=0,w=0,k=1;
  for(let i=n-1;i>=0;i--){s+=stack[i].x*k;w+=k;k*=D.decay;if(k<.002)break;}
  return s/w-CX;
}
function balance(){return clamp(lean()/D.plate,-1.8,1.8);}          // visual tilt
// sway shifts the centre of mass sideways by (angle x height); taller = riskier
function leanRatio(useWob){
  const w=useWob?clamp(wob,-.12,.12):0;
  return (lean()+w*stack.length*LH*.6)/D.plate;
}
// where the next piece should go to bring the tower back to centre (clamped to a legal step)
function idealX(){
  const n=stack.length;if(!n)return CX;
  let S=0,W=0,k=D.decay;
  for(let i=n-1;i>=0;i--){S+=stack[i].x*k;W+=k;k*=D.decay;if(k<.002)break;}
  const t=topX(),m=D.step-D.perfect-5;            // keep the marker inside the legal range,
  return clamp(CX*(1+W)-S,t-m,t+m);               // so aiming at it can never slide off
}
// purely cosmetic: pick the most bent joint so the tower snaps there
function breakIndex(){
  const n=stack.length;let acc=0,best=-1,bi=0;
  for(let i=n-1;i>=1;i--){
    acc+=stack[i].x;
    const v=Math.abs(acc/(n-i)-stack[i-1].x);
    if(v>best){best=v;bi=i;}
  }
  return best>D.step*.55?bi:0;
}
function topY(){return STACK_Y-stack.length*LH;}
function topX(){return stack.length?stack[stack.length-1].x:CX;}
function moverY(){return topY()-DROP_GAP;}      // always a fixed gap above the tower
function towerAngle(){return tiltAnim+balance()*D.tiltK+wob;}
// the tower is drawn rotated around (CX,BASE_Y); convert a screen x back into
// the tower's own coordinates so a piece lands exactly where the player saw it drop
function toLocalX(x,y){
  const a=towerAngle();
  return CX+(x-CX)*Math.cos(a)+(y-BASE_Y)*Math.sin(a);
}
function toScreenX(x,y){
  const a=towerAngle();
  return CX+(x-CX)*Math.cos(a)-(y-BASE_Y)*Math.sin(a);
}


/* ---------- altitude scenery: city -> clouds -> sky -> space ---------- */
let altS=0;                                   // smoothed climb height in px
const ALT_PER=95;                             // px of "altitude" per burger layer
const SKY=[
  {n:0 ,c:['#BFF0FF','#8CDDF8','#5FC7EE']},
  {n:6 ,c:['#A6E2FB','#7CC9F2','#4CB0E2']},
  {n:11,c:['#4C89C9','#7BB7E4','#A6D6EE']},
  {n:16,c:['#16306B','#2E549C','#5480C2']},
  {n:21,c:['#03040E','#070B22','#0F1636']}
];
function toRGB(c){
  if(c[0]==='#')return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  return c.replace(/[^0-9,]/g,'').split(',').map(Number);
}
function mix(a,b,t){const A=toRGB(a),B=toRGB(b);
  return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}
function skyNow(){
  const h=altS/ALT_PER;
  let i=0;while(i<SKY.length-2&&h>=SKY[i+1].n)i++;
  const A=SKY[i],B=SKY[i+1],t=clamp((h-A.n)/(B.n-A.n),0,1);
  return A.c.map((c,k)=>mix(c,B.c[k],t));
}
function drawSky(){
  const c=skyNow(),g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,c[0]);g.addColorStop(.62,c[1]);g.addColorStop(1,c[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

const IMG={};
for(const k in ART){const i=new Image();i.src=ART[k];IMG[k]=i;}
const ready=i=>i&&i.complete&&i.naturalWidth>0;

function drawStars(){
  const a=clamp((altS-820)/900,0,1);
  if(a<=0||!ready(IMG.stars))return;
  ctx.save();ctx.globalAlpha=a;
  const t=200, off=(altS*.05)%t;
  for(let y=-t;y<H+t;y+=t)for(let x=0;x<W+t;x+=t)ctx.drawImage(IMG.stars,x,y+off,t,t);
  ctx.restore();
}
function sun(x,y){
  const a=clamp(1-altS/1500,0,1);if(a<=0)return;
  ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle='rgba(255,222,110,.35)';ctx.beginPath();ctx.arc(x,y,50,0,7);ctx.fill();
  ctx.fillStyle='#FFD23F';ctx.beginPath();ctx.arc(x,y,34,0,7);ctx.fill();ctx.restore();
}
/* every landmark is one transparent PNG placed on its own parallax layer.
   at = the altitude where it sits level with the tower, f = how fast it scrolls past. */
const SCENE=[
  {img:'fuji'      ,at:-1361,f:.18,x:200,w:640,anchor:'bottom',fade:2400},
  {img:'city'      ,at:-470 ,f:.60,x:200,w:520,anchor:'bottom',fade:900 },
  {img:'tokyotower',at:-470 ,f:.60,x:312,w:215,anchor:'bottom',fade:900 },
  {sun:true        ,at:520  ,f:.50,x:58 },
  {img:'clouds'    ,at:380  ,f:.70,x:200,w:520,anchor:'center'},
  {img:'clouds'    ,at:760  ,f:.70,x:200,w:520,anchor:'center'},
  {img:'plane'     ,at:1045 ,f:.85,x:120,w:205,anchor:'center'},
  {img:'balloon'   ,at:1330 ,f:.80,x:295,w:150,anchor:'center'},
  {img:'satellite' ,at:1645 ,f:.85,x:120,w:265,anchor:'center'},
  {img:'moon'      ,at:1985 ,f:.62,x:290,w:215,anchor:'center'},
  {img:'saturn'    ,at:2325 ,f:.72,x:115,w:275,anchor:'center'},
  {img:'ufo'       ,at:2665 ,f:.90,x:280,w:210,anchor:'center'},
  {img:'rocket'    ,at:3005 ,f:.90,x:150,w:150,anchor:'center'}
];

function drawScenery(){
  for(const it of SCENE){
    const y=300+(altS-it.at)*it.f;
    if(y<-500||y>H+500)continue;
    if(it.sun){sun(it.x,y);continue;}
    const im=IMG[it.img];
    if(!ready(im))continue;
    const w=it.w, h=w*im.naturalHeight/im.naturalWidth;
    const top=it.anchor==='bottom'?y-h:y-h/2;
    let a=1;
    if(it.fade)a=clamp(1-Math.max(0,altS-(it.fade-700))/700,0,1);
    if(a<=0)continue;
    ctx.save();ctx.globalAlpha=a;
    ctx.drawImage(im,it.x-w/2,top,w,h);
    ctx.restore();
  }
}

function drawPlate(){
  ctx.beginPath();ctx.ellipse(CX,BASE_Y+16,110,19,0,0,7);
  ctx.fillStyle=vgrad(BASE_Y-4,40,[[0,'#FFFFFF'],[1,'#D8E7F0']]);ctx.fill();ink(2.5);
  ctx.beginPath();ctx.ellipse(CX,BASE_Y+9,80,12,0,0,7);ctx.fillStyle='#EDF6FD';ctx.fill();
  ctx.setLineDash([4,5]);ctx.lineWidth=3;ctx.strokeStyle='rgba(59,42,32,.4)';
  ctx.beginPath();ctx.moveTo(CX-D.plate,BASE_Y-1);ctx.lineTo(CX-D.plate,BASE_Y+9);
  ctx.moveTo(CX+D.plate,BASE_Y-1);ctx.lineTo(CX+D.plate,BASE_Y+9);ctx.stroke();ctx.setLineDash([]);
}

function draw(){
  drawSky();
  drawStars();
  drawScenery();
  ctx.fillStyle='#FF6B6B';ctx.fillRect(0,BASE_Y+24,W,H);
  ctx.fillStyle='rgba(255,255,255,.85)';
  for(let r=0;r<3;r++)for(let i=0;i<10;i++)if((i+r)%2)ctx.fillRect(i*40,BASE_Y+24+r*30,40,30);

  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.translate(0,cam);
  drawPlate();

  ctx.save();
  ctx.translate(CX,BASE_Y);ctx.rotate(tiltAnim+balance()*D.tiltK+wob);ctx.translate(-CX,-BASE_Y);
  const tp=topple;let tipped=false;
  const tipOpen=()=>{ctx.save();ctx.translate(tp.px,tp.py);ctx.rotate(tp.dir*tp.ang);
                     ctx.translate(-tp.px,-tp.py);tipped=true;};
  if(tp&&tp.idx===0)tipOpen();
  bottomBun();
  for(let i=0;i<stack.length;i++){
    if(tp&&!tipped&&i===tp.idx)tipOpen();
    ING[stack[i].t].draw(stack[i].x,STACK_Y-(i+1)*LH,stack[i].s);
  }
  topBun(topX(),topY()+3);
  if(tipped)ctx.restore();
  ctx.restore();

  if(state==='play'&&mover){
    if(D.guide){
    const gx=toScreenX(idealX(),topY()-LH/2);       // where to aim to straighten the tower
    ctx.save();
    ctx.strokeStyle='rgba(46,155,79,.45)';ctx.setLineDash([5,6]);ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(gx,topY()-14);ctx.lineTo(gx,moverY()+LH+30);ctx.stroke();
    ctx.setLineDash([]);
    const my=moverY()+LH+18;
    ctx.beginPath();ctx.moveTo(gx-11,my-13);ctx.lineTo(gx+11,my-13);ctx.lineTo(gx,my);ctx.closePath();
    ctx.fillStyle='#5FD35A';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#3B2A20';ctx.stroke();
    ctx.restore();
    }
    ctx.save();ctx.strokeStyle='rgba(59,42,32,.22)';ctx.setLineDash([3,8]);ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(mover.x,moverY()+LH+6);ctx.lineTo(mover.x,topY()-10);ctx.stroke();ctx.restore();
    ING[mover.t].draw(mover.x,moverY(),mover.s);
  }
  if(falling)ING[falling.t].draw(falling.x,falling.y,falling.s);

  for(const d of debris){ctx.save();
    ctx.translate(d.x,d.y);ctx.rotate(d.rot);ING[d.t].draw(0,-LH/2,d.s);ctx.restore();}
  for(const b of bits){ctx.globalAlpha=clamp(b.life,0,1);dot(b.x,b.y,b.r,b.col);ctx.globalAlpha=1;}
  for(const p of pops){
    ctx.save();ctx.globalAlpha=clamp(p.life,0,1);ctx.textAlign='center';
    ctx.font='900 '+(p.big?31:22)+'px "M PLUS Rounded 1c","Baloo 2",sans-serif';
    ctx.lineWidth=6;ctx.strokeStyle='#3B2A20';ctx.lineJoin='round';
    ctx.strokeText(p.txt,p.x,p.y);ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y);ctx.restore();
  }
  ctx.restore();
  if(flashT>0){ctx.fillStyle='rgba(255,255,255,'+(flashT*.4)+')';ctx.fillRect(0,0,W,H);}
}

function pickType(){
  let t;do{t=KEYS[(Math.random()*KEYS.length)|0];}while(stack.length&&t===stack[stack.length-1].t);
  return t;
}
function spawn(){
  const prog=1-timeLeft/GAME_TIME;
  mover={x:CX+(Math.random()<.5?-1:1)*118,dir:Math.random()<.5?-1:1,
    sp:D.sp0+prog*D.sp1+Math.min(stack.length,20)*.045,t:pickType(),s:Math.random()*99};
}
function reset(){
  stack=[];mover=null;falling=null;debris=[];pops=[];bits=[];
  cam=0;altS=0;best=0;combo=0;topple=null;timeLeft=GAME_TIME;tiltAnim=0;shake=0;wob=0;wobV=0;overT=0;
  clouds=[{x:300,y:92,r:26,v:.12},{x:120,y:168,r:20,v:.08},{x:346,y:236,r:16,v:.05}];
  spawn();sync();
}
function drop(){
  if(state!=='play'||!mover||falling)return;
  falling={x:mover.x,y:moverY(),vy:0,t:mover.t,s:mover.s};mover=null;
  sfxDrop();
}
function pop(txt,col,big,dy){
  const busy=pops.filter(q=>q.life>.5).length;          // keep clear of live messages
  pops.push({x:topX(),y:topY()-40+(dy||0)-busy*34,life:1,txt,col,big:!!big});
}
function land(){
  const lx=toLocalX(falling.x,falling.y+LH/2);
  const tx=topX(),step=lx-tx;
  if(Math.abs(step)>D.step){                       // too far from the piece below: it slides off
    debris.push({x:falling.x,y:topY(),vy:-1,vx:Math.sign(step)*2.4,rot:0,vr:Math.sign(step)*.13,life:1.4,t:falling.t,s:falling.s});
    falling=null;combo=0;shake=10;
    sfxMiss();
    collapse(Math.sign(step),'はずれた！',stack.length);
    return;
  }
  const target=idealX(), aim=lx-target;            // "perfect" = the balance-restoring spot
  const before=Math.abs(lean());
  let x=lx,perfect=false;
  if(Math.abs(aim)<=D.perfect){x=target;perfect=true;}
  stack.push({x,t:falling.t,s:falling.s});
  falling=null;best=Math.max(best,stack.length);
  const after=Math.abs(lean());

  wobV+=step*D.wobK*(1+stack.length*.05);
  if(after<before)wobV*=.45;                       // correcting the lean calms the tower
  if(perfect){wobV*=.3;overT=0;}

  const z=stack.length;
  if(z===6)pop('くもの うえ！','#FFFFFF',true,-118);
  else if(z===11)pop('たかい そら！','#BFE9FF',true,-118);
  else if(z===16)pop('うちゅうだ！','#FFE14D',true,-118);
  if(perfect){
    combo++;
    pop(combo>1?'ぴったり×'+combo:'ぴったり！','#FFE14D',true);
    for(let i=0;i<12;i++)bits.push({x:x+(Math.random()-.5)*100,y:topY()+10,vy:-1.5-Math.random()*2,
      vx:(Math.random()-.5)*2.4,r:2+Math.random()*2.4,life:1,
      col:['#FFD23F','#FF5C5C','#5FD35A','#FFFFFF'][(Math.random()*4)|0]});
    sfxPerfect(combo);
  }else{
    combo=0;sfxLand();shake=Math.abs(aim)/18;
    if(after>before&&after/D.plate>.6)pop('かたむいてる！','#FF8A3D');
  }
  spawn();
  sync();
}
// once it has tipped far enough the pieces separate, carrying the tower's spin outward
function burstTopple(){
  const tp=topple;if(!tp)return;
  const ta=towerAngle(), w=tp.av*tp.dir;         // angular speed at the moment it lets go
  for(let i=tp.idx;i<stack.length;i++){
    const p=stack[i], ly=STACK_Y-(i+1)*LH-LH/2;
    // where the piece actually is after the tower lean + the tip rotation
    const a1=ta, c1=Math.cos(a1), s1=Math.sin(a1);
    let x=CX+(p.x-CX)*c1-(ly-BASE_Y)*s1, y=BASE_Y+(p.x-CX)*s1+(ly-BASE_Y)*c1;
    const a2=tp.dir*tp.ang, c2=Math.cos(a2), s2=Math.sin(a2);
    const dx=x-tp.px, dy=y-tp.py;
    x=tp.px+dx*c2-dy*s2; y=tp.py+dx*s2+dy*c2;
    const rx=x-tp.px, ry=y-tp.py;
    debris.push({x,y,t:p.t,s:p.s,rot:a1+a2,
      vx:-w*ry+tp.dir*2.2+(Math.random()-.5)*1.2,
      vy: w*rx-1.2+Math.random()*.8,
      vr:w*1.4+tp.dir*(.02+Math.random()*.05)});
  }
  stack.splice(tp.idx);
  topple=null;wob=0;wobV=0;sync();
}
function collapse(dir,label,idx){
  if(state!=='play')return;
  state='collapse';collapseT=0;collapseDir=dir||1;
  const cut=idx===undefined?0:idx;
  if(cut<stack.length){
    // pivot on the edge it is leaning over, so the tower tips instead of bursting
    const bx=cut>0?stack[cut-1].x:CX;
    topple={idx:cut,dir:collapseDir,ang:0,av:.005,done:false,
            px:bx+collapseDir*(cut>0?LW*.34:62),
            py:cut>0?STACK_Y-cut*LH:BASE_Y};
  }else topple=null;
  shake=5;pop(label||'くずれた！','#FF3B3B',true);
  sfxCollapse();sync();
}
function gameOver(reason){
  if(state==='over')return;
  state='over';musicStop();
  if(reason==='time'){sfxWhistle();setTimeout(sfxEnd,880);}else setTimeout(sfxEnd,420);
  $('reason').textContent=reason==='time'?'タイムアップ！':'くずれちゃった！';
  $('finalN').textContent=best;
  const r=best>=22?'うちゅうまで とどいた 🚀':best>=15?'そらを こえた ✈':best>=8?'くもの うえまで ☁':best>=4?'東京タワーの たかさ 🗼':'まずは 1こから 🐣';
  $('rank').textContent=r+'（'+D.label+'）';
  $('endNote').innerHTML=best>=15
    ?'グラグラでも<br>まんなかを ねらえてるね！'
    :(D.guide?'かたむいたら はんたいがわ<br>みどりの ▼ を ねらおう'
             :'かたむいたら はんたいがわに<br>おいて たてなおそう');
  $('endVeil').hidden=false;
}
function sync(){
  $('cur').innerHTML=stack.length+'<small>こ</small>';
  $('best').innerHTML=best+'<small>こ</small>';
}

function tick(t){
  const dt=Math.min((t-lastT)/16.667||1,3);lastT=t;
  for(const c of clouds){c.x+=c.v*dt;if(c.x-c.r>W+40)c.x=-60;}
  // height and camera only follow the tower while it is standing; once it falls they
  // stay put, so the view holds at the altitude the run ended at
  if(state==='play'||state==='ready')altS=lerp(altS,stack.length*ALT_PER,.07*dt);

  if(state==='play'||state==='collapse'){
    timeLeft-=dt/60;
    if(timeLeft<=0){timeLeft=0;gameOver('time');}
    $('time').innerHTML=Math.ceil(timeLeft)+'<small>びょう</small>';
    $('timefill').style.width=(timeLeft/GAME_TIME*100)+'%';
    $('timebar').classList.toggle('low',timeLeft<=10);
    $('timeBox').classList.toggle('low',timeLeft<=10);
  }
  // camera keeps the tower top (and therefore the falling piece) on screen
  if(state==='play'||state==='ready')cam=lerp(cam,Math.max(0,CAM_TOP-topY()),.14*dt);

  if(state==='play'){
    // spring sway
    wobV-=wob*.055*dt;
    wobV*=Math.pow(D.wobDamp,dt);
    wob+=wobV*dt;
    // an overhang that cannot be supported snaps at once; sway needs to hold past the line
    const r0=leanRatio(false);
    if(Math.abs(r0)>=1)collapse(Math.sign(r0),'ささえられない！',breakIndex());
    else{
      const r1=leanRatio(true);
      if(Math.abs(r1)>=1){overT+=dt;if(overT>14)collapse(Math.sign(r1),'グラッ…！',breakIndex());}
      else overT=Math.max(0,overT-dt*.6);
    }

    if(mover){
      mover.x+=mover.dir*mover.sp*dt;
      const lim=140+Math.min(stack.length,10)*2;
      if(mover.x>CX+lim){mover.x=CX+lim;mover.dir=-1;}
      if(mover.x<CX-lim){mover.x=CX-lim;mover.dir=1;}
    }
    if(falling){
      falling.vy+=.95*dt;falling.y+=falling.vy*dt;
      if(falling.y+LH>=topY()){falling.y=topY()-LH;land();}
    }
  }
  if(state==='collapse'){
    collapseT+=dt;
    wobV*=Math.pow(.92,dt);wob+=wobV*dt;wob*=Math.pow(.95,dt);     // the standing part settles
    if(topple){
      topple.av+=.0013*(.3+Math.sin(topple.ang))*dt;               // slow start, then it goes over
      topple.ang+=topple.av*dt;
      if(topple.ang>.62){shake=7;sfxThud();burstTopple();}   // let go and fall away
    }
    if(collapseT>76)gameOver('fall');
  }
  for(const d of debris){d.vy+=.62*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.rot+=d.vr*dt;}
  debris=debris.filter(d=>d.y+cam<H+300&&d.x>-240&&d.x<W+240);
  for(const b of bits){b.vy+=.24*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=.028*dt;}
  bits=bits.filter(b=>b.life>0);
  for(const p of pops){p.y-=.6*dt;p.life-=.016*dt;}
  pops=pops.filter(p=>p.life>0);
  shake=Math.max(0,shake-.5*dt);flashT=Math.max(0,flashT-.05*dt);

  const b=clamp(leanRatio(true),-1,1);
  const sl=$('slice');
  sl.style.left=(50+b*45)+'%';
  sl.classList.toggle('hot',Math.abs(b)>.7);

  draw();
  requestAnimationFrame(tick);
}

cv.addEventListener('pointerdown',e=>{if(state==='play'){e.preventDefault();drop();}});
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(state==='play')drop();
    else start(selDiff);          // Space also starts from the title / result screen
  }
});
function start(key){
  selDiff=key;D=DIFFS[key];markDiff();
  $('startVeil').hidden=true;$('endVeil').hidden=true;
  reset();state='play';lastT=performance.now();
  sfxStart();musicStart();
}
let selDiff='easy';
function markDiff(){document.querySelectorAll('[data-diff]').forEach(b=>
  b.setAttribute('aria-pressed',b.dataset.diff===selDiff?'true':'false'));}
document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{selDiff=b.dataset.diff;markDiff();});
$('startBtn').onclick=()=>start(selDiff);
$('againBtn').onclick=()=>start(selDiff);
$('backBtn').onclick=()=>{musicStop();$('endVeil').hidden=true;$('startVeil').hidden=false;state='ready';};
markDiff();

document.querySelectorAll('.btn,.mute').forEach(el=>
  el.addEventListener('pointerdown',()=>{audio();sfxTap();}));

reset();state='ready';
requestAnimationFrame(t=>{lastT=t;tick(t);});
})();
</script>
